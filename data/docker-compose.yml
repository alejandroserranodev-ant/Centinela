# Disposable PostgreSQL that runs sql/01_esquema.sql, sql/02_carga.sql and
# sql/03_capa_semantica.sql against csv/ on first start, per `data/AGENTS.md`.
services:
  db:
    image: postgres:16-alpine
    container_name: centinela-db
    environment:
      POSTGRES_DB: centinela
      POSTGRES_USER: centinela
      POSTGRES_PASSWORD: centinela
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./sql/02_carga.sql:/docker-entrypoint-initdb.d/02_carga.sql:ro
      - ./sql/03_capa_semantica.sql:/docker-entrypoint-initdb.d/03_capa_semantica.sql:ro
      - ./csv:/csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centinela -d centinela"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: centinela-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@centinela.dev
      PGADMIN_DEFAULT_PASSWORD: centinela
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
