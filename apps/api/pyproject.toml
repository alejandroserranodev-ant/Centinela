[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centinela-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "centinela-agents",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.1",
  "pydantic>=2",
  "python-dotenv>=1",
  "langgraph>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
centinela-agents = { path = "../../packages/agents", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracion: needs the Postgres from data/docker-compose.yml with DSN_ADMIN set"]
