[project]
name = "centinela-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "centinela-tools",
  "langgraph>=1.0",
  "langchain>=1.0",
  "langfuse>=3",
  "openai>=1.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
centinela-tools = { path = "../tools", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["centinela_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not modelo'"
markers = ["modelo: calls the model and the kernel of the root .env and .env.local; skipped when either is unusable"]
