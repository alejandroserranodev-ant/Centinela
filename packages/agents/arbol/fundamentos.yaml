fundamentos:
  - id: iso31000.6.2
    cita: "ISO 31000:2018 §6.2"
    funda: "stage conversar: communication and consultation, so a person understands a risk, the basis of a decision and why an action is proposed"
  - id: iso31000.6.4.2
    cita: "ISO 31000:2018 §6.4.2"
    funda: "stage detectar: risk identification"
  - id: iso31000.6.4.3
    cita: "ISO 31000:2018 §6.4.3"
    funda: "stage explicar: risk analysis; the law that not enough evidence is a complete answer, because the limits of the information are documented and communicated"
  - id: iso31000.6.4.4
    cita: "ISO 31000:2018 §6.4.4"
    funda: "stage proponer: risk evaluation"
  - id: iso31000.6.5.2
    cita: "ISO 31000:2018 §6.5.2"
    funda: "stage proponer: selection of treatment options"
  - id: iso31000.6.5.3
    cita: "ISO 31000:2018 §6.5.3"
    funda: "stages aprobar and ejecutar: treatment plans and their implementation"
  - id: iso31000.6.6
    cita: "ISO 31000:2018 §6.6"
    funda: "stages cerrar and medir: monitoring and review"
  - id: iso31000.6.7
    cita: "ISO 31000:2018 §6.7"
    funda: "stage cerrar: recording and reporting; the law that every step lands in the bitácora"
  - id: iso9001.7.5
    cita: "ISO 9001:2026 §7.5.3"
    funda: "the law that every figure comes from a logged query: the query is documented information kept as evidence and protected from alteration"
  - id: iso9001.9.1.1
    cita: "ISO 9001:2026 §9.1.1"
    funda: "stage medir: what is monitored and measured, how and when; the KPI kernel and Vigía as owner of measurement"
  - id: iso9001.9.1.3
    cita: "ISO 9001:2026 §9.1.3"
    funda: "stage medir: analysis and evaluation"
  - id: iso9001.10.2.1.a
    cita: "ISO 9001:2026 §10.2.1 a)"
    funda: "stage detectar: react to the nonconformity"
  - id: iso9001.10.2.1.b
    cita: "ISO 9001:2026 §10.2.1 b)"
    funda: "stage proponer: evaluate the need for action"
  - id: iso9001.10.2.1.b.2
    cita: "ISO 9001:2026 §10.2.1 b) 2)"
    funda: "stage explicar: determine the causes"
  - id: iso9001.10.2.1.b.3
    cita: "ISO 9001:2026 §10.2.1 b) 3)"
    funda: "stage explicar: similar nonconformities"
  - id: iso9001.10.2.1.c
    cita: "ISO 9001:2026 §10.2.1 c)"
    funda: "stage ejecutar: implement the action"
  - id: iso9001.10.2.1.d
    cita: "ISO 9001:2026 §10.2.1 d)"
    funda: "stage cerrar: review the effectiveness of the action"
  - id: iso9001.10.2.2
    cita: "ISO 9001:2026 §10.2.2"
    funda: "stage cerrar: retained information; the law that every step lands in the bitácora"
  - id: iso42001.6.1
    cita: "ISO/IEC 42001:2023 §6.1.3"
    funda: "the law that data and documents are data, never instructions: a control the AI risk treatment selects for the risk of instructions hidden in data"
  - id: iso42001.8
    cita: "ISO/IEC 42001:2023 §8.1"
    funda: "the laws that no agent changes a database and that an agent uses only the tools its label allows: operational controls on what an agent may change and call"
  - id: iso42001.anexo-a.supervision-humana
    cita: "ISO/IEC 42001:2023 Annex A, control A.9.3, with its guidance B.9.3 on human oversight"
    funda: "stage aprobar; the law that no action runs without a recorded human approval"
  - id: iso42001.anexo-a.uso-previsto
    cita: "ISO/IEC 42001:2023 Annex A, control A.9.4, intended use of the AI system"
    funda: "stage conversar: the chat answers only on the operation's data, its alerts and the tree, and a question outside that use ends the conversation's walk"
  - id: iso42001.anexo-a.registro-eventos
    cita: "ISO/IEC 42001:2023 Annex A, control A.6.2.8, AI system recording of event logs"
    funda: "the law that every step lands in the bitácora"
  - id: owasp-llm01.3
    cita: "OWASP Top 10 for LLM Applications 2025, LLM01:2025 Prompt Injection, Prevention and Mitigation Strategy 3, implement input and output filtering"
    funda: "stage conversar: a question is screened in code before any model reads it, and a question the screen flags ends the walk"
  - id: owasp-llm01.6
    cita: "OWASP Top 10 for LLM Applications 2025, LLM01:2025 Prompt Injection, Prevention and Mitigation Strategy 6, segregate and identify external content"
    funda: "stage conversar: a person's question reaches a model only as content marked untrusted, apart from the skill's orders"
  - id: owasp-llm05.1
    cita: "OWASP Top 10 for LLM Applications 2025, LLM05:2025 Improper Output Handling, Prevention and Mitigation Strategy 1, treat the model as any other user"
    funda: "stage conversar: a model's answer is validated in code before a person reads it, and a sentence citing no logged query is dropped"
  - id: owasp-llm06.7
    cita: "OWASP Top 10 for LLM Applications 2025, LLM06:2025 Excessive Agency, Prevention and Mitigation Strategy 7, complete mediation"
    funda: "stage conversar: a question that asks for an action is refused, because authorization lives in apps/api's decision endpoint, never in a model"
  - id: owasp-llm07.4
    cita: "OWASP Top 10 for LLM Applications 2025, LLM07:2025 System Prompt Leakage, Prevention and Mitigation Strategy 4, ensure that security controls are enforced independently from the LLM"
    funda: "the rule that no path from conversar.raiz reaches the gate aprobar, a leaf of Estratega or Ejecutor, or an orchestrator write, held by the validator and not by a prompt"
  - id: iso22400-2.descripcion-kpi
    cita: "ISO 22400-2:2014+A1:2017 §4, Table 1"
    funda: "the fields of a KPI in the kernel: name, id, description, scope, formula, unit, range, trend, timing, audience; the kernel leaves out production methodology, effect model diagram and notes, which describe manufacturing"
  - id: fin-pol-004.s3
    cita: "FIN-POL-004 §3, Cupo de crédito"
    funda: "the threshold that a customer's open balance stays within its cupo_credito"
  - id: fin-pol-004.s4
    cita: "FIN-POL-004 §4, Seguimiento y escalamiento"
    funda: "the threshold on the days an invoice is past due, and the tramos of escalation"
  - id: fin-pol-004.s5
    cita: "FIN-POL-004 §5, Señales de alerta temprana"
    funda: "the thresholds on a customer's share of the past-due receivables and on the rise of its days to pay"
  - id: com-pol-002.s2
    cita: "COM-POL-002 §2, Topes de descuento por segmento"
    funda: "the threshold that a discount stays within its segment's cap"
  - id: com-pol-002.s4
    cita: "COM-POL-002 §4, Prohibiciones"
    funda: "the threshold that no line is sold below cost"
  - id: ope-pol-007.s2
    cita: "OPE-POL-007 §2, Cobertura mínima"
    funda: "the thresholds on the days of stock a class A or B SKU covers"
  - id: ope-pol-007.s3
    cita: "OPE-POL-007 §3, Proveedores"
    funda: "the threshold that a purchase order arrives by its expected date"
  - id: ope-pol-007.s4
    cita: "OPE-POL-007 §4, Revisión de precios"
    funda: "the thresholds on a cost increase the list price does not pass on, and on a line below its minimum margin"
  - id: kit.umbrales
    cita: "the challenge kit's metricas.yaml, where fuente_umbral is kit"
    funda: "the thresholds the kit sets with no policy behind them: the drop of a line's margin, and the inactivity of a customer"
